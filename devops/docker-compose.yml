name: redd

services:
  redd-admin-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8000}
      HOST: redd-postgres
      DB_USER: ${DB_USER:-myke}
      PASSWORD: ${PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-redd_admin}
      DB_PORT: 5432
      SSLMODE: ${SSLMODE:-disable}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@redd.example}
      ADMIN_NAME: ${ADMIN_NAME:-Redd Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-redd}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-redd}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:-}
    ports:
      - "${API_PORT:-8000}:${PORT:-8000}"
    depends_on:
      redd-postgres:
        condition: service_healthy

  redd-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-myke}
      POSTGRES_PASSWORD: ${PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-redd_admin}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myke} -d ${DB_NAME:-redd_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
